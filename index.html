<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixelea - Canlı Dünya Tuvali</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #0b0f19; color: #fff; }
    #toolbar {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 100;
      display: flex; align-items: center; gap: 20px; background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(8px); padding: 10px 20px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .logo { font-weight: 800; font-size: 1.2rem; background: linear-gradient(45deg, #3498db, #2ecc71); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .control-group { display: flex; align-items: center; gap: 8px; }
    input[type="color"] { border: none; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; background: transparent; }
    .info { display: flex; gap: 15px; font-size: 0.85rem; color: #a1a1aa; }
    .info strong { color: #fff; }
    #canvas-container { width: 100vw; height: 100vh; cursor: grab; }
    #canvas-container:active { cursor: grabbing; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div id="toolbar">
    <div class="logo">Pixelea</div>
    <div class="control-group">
      <label for="colorPicker">Renk:</label>
      <input type="color" id="colorPicker" value="#ff0000">
    </div>
    <div class="info">
      <span>Koordinat: <strong id="coords">X: 0, Y: 0</strong></span>
      <span>Zoom: <strong id="zoomLevel">100%</strong></span>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="pixelCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('pixelCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');
    const colorPicker = document.getElementById('colorPicker');
    const coordsText = document.getElementById('coords');
    const zoomText = document.getElementById('zoomLevel');

    const GRID_WIDTH = 4000;
    const GRID_HEIGHT = 2000;
    const pixelData = new Map();

    let scale = 0.5;
    let offsetX = 0;
    let offsetY = 0;
    let isDragging = false, startX = 0, startY = 0, hasMoved = false;

    const mapCanvas = document.createElement('canvas');
    mapCanvas.width = GRID_WIDTH;
    mapCanvas.height = GRID_HEIGHT;
    const mapCtx = mapCanvas.getContext('2d');

    const worldMapImg = new Image();
    worldMapImg.crossOrigin = "anonymous";
    worldMapImg.src = 'https://upload.wikimedia.org/wikipedia/commons/e/ec/World_map_blank_without_borders.svg';
    
    worldMapImg.onload = () => {
      mapCtx.drawImage(worldMapImg, 0, 0, GRID_WIDTH, GRID_HEIGHT);
      loadPixels(); // Sayfa açılınca veritabanından pikselleri çek
    };

    function init() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      offsetX = (canvas.width - GRID_WIDTH * scale) / 2;
      offsetY = (canvas.height - GRID_HEIGHT * scale) / 2;
      draw();
    }

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      draw();
    });

    // Veritabanından pikselleri yükleme fonksiyonu
    async function loadPixels() {
      try {
        const res = await fetch('/api/pixels');
        const data = await res.json();
        pixelData.clear();
        Object.keys(data).forEach(key => {
          pixelData.set(key, data[key]);
        });
        draw();
      } catch (e) {
        console.error("Pikseller yüklenemedi:", e);
      }
    }

    function isLand(x, y) {
      if (x < 0 || x >= GRID_WIDTH || y < 0 || y >= GRID_HEIGHT) return false;
      const pixel = mapCtx.getImageData(x, y, 1, 1).data;
      return pixel[3] > 20;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.imageSmoothingEnabled = false;

      ctx.save();
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);

      ctx.fillStyle = "#101826";
      ctx.fillRect(0, 0, GRID_WIDTH, GRID_HEIGHT);

      if (worldMapImg.complete) {
        ctx.globalAlpha = 0.35;
        ctx.drawImage(worldMapImg, 0, 0, GRID_WIDTH, GRID_HEIGHT);
        ctx.globalAlpha = 1.0;
      }

      pixelData.forEach((color, key) => {
        const [x, y] = key.split(',').map(Number);
        ctx.fillStyle = color;
        ctx.fillRect(x, y, 1, 1);
      });

      ctx.strokeStyle = "#3498db";
      ctx.lineWidth = 1 / scale;
      ctx.strokeRect(0, 0, GRID_WIDTH, GRID_HEIGHT);

      ctx.restore();
      zoomText.innerText = `${Math.round(scale * 100)}%`;
    }

    container.addEventListener('mousedown', (e) => {
      if (e.button === 0) { 
        isDragging = true; 
        hasMoved = false; 
        startX = e.clientX - offsetX; 
        startY = e.clientY - offsetY; 
      }
    });

    window.addEventListener('mousemove', (e) => {
      const gridX = Math.floor((e.clientX - offsetX) / scale);
      const gridY = Math.floor((e.clientY - offsetY) / scale);

      if (gridX >= 0 && gridX < GRID_WIDTH && gridY >= 0 && gridY < GRID_HEIGHT) {
        coordsText.innerText = `X: ${gridX}, Y: ${gridY}`;
      }

      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      if (Math.abs(dx - offsetX) > 3 || Math.abs(dy - offsetY) > 3) {
        hasMoved = true;
      }
      offsetX = dx; 
      offsetY = dy;
      draw();
    });

    window.addEventListener('mouseup', async (e) => {
      if (!isDragging) return;
      isDragging = false;

      if (!hasMoved) {
        const gridX = Math.floor((e.clientX - offsetX) / scale);
        const gridY = Math.floor((e.clientY - offsetY) / scale);

        if (gridX >= 0 && gridX < GRID_WIDTH && gridY >= 0 && gridY < GRID_HEIGHT) {
          if (isLand(gridX, gridY)) {
            const color = colorPicker.value;
            pixelData.set(`${gridX},${gridY}`, color);
            draw();

            // Pikseli anında veritabanına gönder (POST)
            try {
              await fetch('/api/pixels', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ x: gridX, y: gridY, color })
              });
            } catch (err) {
              console.error("Piksel kaydedilemedi:", err);
            }
          }
        }
      }
    });

    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = 1.15;
      let newScale = e.deltaY < 0 ? scale * zoomFactor : scale / zoomFactor;
      newScale = Math.max(0.1, Math.min(150, newScale));

      const mouseX = e.clientX;
      const mouseY = e.clientY;

      offsetX = mouseX - (mouseX - offsetX) * (newScale / scale);
      offsetY = mouseY - (mouseY - offsetY) * (newScale / scale);
      scale = newScale;

      draw();
    }, { passive: false });

    init();

    // Her 3 saniyede bir veritabanını kontrol et (Canlı Eşitleme)
    setInterval(loadPixels, 3000);
  </script>
</body>
</html>
